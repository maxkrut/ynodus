name: Build and Pages

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      browser_suite:
        description: Browser validation (only full can publish)
        type: choice
        default: full
        options: [full, layout]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: ["20.19.0", "22.12.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium for production smoke
        run: npx playwright install --with-deps chromium

      - name: Browser smoke
        env:
          BROWSER_SUITE: ${{ inputs.browser_suite || 'full' }}
        run: |
          if [ "$BROWSER_SUITE" = "layout" ]; then
            npx playwright test \
              tests/e2e/annotations.spec.ts tests/e2e/audit-query.spec.ts \
              tests/e2e/audit-round2-alignment.spec.ts tests/e2e/full-audit-regressions.spec.ts \
              tests/e2e/header-query-reading.spec.ts tests/e2e/period-labels.spec.ts \
              tests/e2e/compact-locale.spec.ts tests/e2e/layout-reading.spec.ts \
              tests/e2e/ledger-layout.spec.ts tests/e2e/production-geometry.spec.ts \
              tests/e2e/setting-switches.spec.ts tests/e2e/content-density.spec.ts \
              tests/e2e/query-panel-layout.spec.ts tests/e2e/production-workflows.spec.ts \
              tests/e2e/density-focus.spec.ts tests/e2e/density-drag.spec.ts \
              tests/e2e/audit-visual.spec.ts
          else
            npm run test:e2e
          fi

      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          retention-days: 7

      - name: Verify static hosting at root and project paths
        run: npm run test:pages

      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_PAGES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.browser_suite == 'full')
        uses: actions/configure-pages@v5

      - name: Upload verified site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_PAGES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.browser_suite == 'full')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_PAGES == 'true' && (github.event_name != 'workflow_dispatch' || inputs.browser_suite == 'full')
    needs: [minimum-node, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@v4
